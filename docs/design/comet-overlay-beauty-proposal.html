<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comet Overlay Beauty Proposal</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; background: #030409; color: #e5e7eb; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; box-sizing: border-box; }
    main { width: min(1600px, 100%); }
    header { margin-bottom: 18px; display: flex; justify-content: space-between; gap: 18px; align-items: end; }
    h1 { margin: 0; font-size: 24px; line-height: 1.2; }
    p { margin: 8px 0 0; color: #94a3b8; }
    .frame { border: 1px solid #1f2937; border-radius: 12px; overflow: hidden; background: #05070d; box-shadow: 0 24px 80px rgba(0,0,0,.42); }
    img { display: block; width: 100%; height: auto; }
    .badge { border: 1px solid rgba(249,115,22,.45); color: #fed7aa; border-radius: 999px; padding: 7px 11px; font-size: 12px; white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>彗星 Overlay 美化方案效果图</h1>
        <p>基于当前功能：活动上下文、轨迹、影响系统、尾迹、点击 inspector。</p>
      </div>
      <div class="badge">Recommended Direction</div>
    </header>
    <div class="frame">
      <img src="comet-overlay-beauty-proposal.svg" alt="Comet overlay beauty proposal">
    </div>
  </main>
</body>
</html>
