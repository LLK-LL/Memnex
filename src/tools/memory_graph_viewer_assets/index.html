<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Total Agent Memory Galaxy</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/pixi.js@8.2.6/dist/pixi.min.js"></script>
</head>
<body>
  <main class="app galaxy-app">
    <aside class="sidebar">
      <header>
        <h1>Memory Galaxy</h1>
        <p id="stats">Loading galaxy...</p>
        <nav class="mode-links">
          <a class="active" href="index.html">2D Galaxy</a>
          <a href="viewer-3d.html">3D Sphere</a>
        </nav>
      </header>

      <label class="field">
        Search
        <input id="search" type="search" placeholder="node, project, concept">
      </label>

      <section>
        <h2>Node Types</h2>
        <div id="typeFilters" class="filters"></div>
      </section>

      <section>
        <h2>Galaxy Layers</h2>
        <div id="layerFilters" class="filters compact"></div>
      </section>

      <label class="field">
        Minimum edge weight
        <input id="weightFilter" type="range" min="0" max="10" step="0.1" value="0">
        <span id="weightValue">0</span>
      </label>

      <label class="field">
        Timeline
        <input id="timelineFilter" type="range" min="0" max="100" step="1" value="100">
        <span id="timelineValue">All time</span>
      </label>

      <section>
        <h2>Galaxy Feel</h2>
        <label class="field compact-field">
          Edge density
          <input id="edgeDensity" type="range" min="1" max="8" step="1" value="4">
          <span id="edgeDensityValue">4 links / star</span>
        </label>
        <label class="field compact-field">
          Labels
          <select id="labelMode">
            <option value="minimal">Minimal</option>
            <option value="normal" selected>Normal</option>
            <option value="dense">Dense</option>
          </select>
        </label>
        <label class="field compact-field">
          Spring
          <input id="springStrength" type="range" min="0" max="100" step="5" value="70">
          <span id="springStrengthValue">Playful</span>
        </label>
      </section>

      <section>
        <h2>Priority Scale</h2>
        <div class="legend-list">
          <span><i class="legend-dot router"></i>Router</span>
          <span><i class="legend-dot persona"></i>Persona</span>
          <span><i class="legend-dot skill"></i>Skill</span>
          <span><i class="legend-dot harness"></i>Harness</span>
          <span><i class="legend-dot rule"></i>Rule</span>
          <span><i class="legend-dot preference"></i>Preference</span>
        </div>
      </section>

      <section>
        <h2>View</h2>
        <div class="buttons">
          <button id="fit" type="button">Fit</button>
          <button id="clearFocus" type="button">Clear</button>
          <button id="focusNeighborhood" type="button">Neighborhood</button>
          <button id="focusView" type="button">Focus View</button>
        </div>
      </section>
    </aside>

    <section id="galaxy2d" class="galaxy-canvas" aria-label="2D memory galaxy"></section>

    <aside class="details">
      <h2>Agent Prompt</h2>
      <div id="agentPrompt" class="agent-prompt">Select or drag a node to stage an agent prompt.</div>
      <h2>Selection</h2>
      <div id="details">Select a node to inspect linked memories.</div>
    </aside>
  </main>
  <script type="module" src="viewer.js"></script>
</body>
</html>
